[project]
site_name = "HPC Portal Documentation"
site_description = "User documentation for the REANNZ HPC Portal"
site_url = "https://nesi.github.io/hpc-portal_docs/"
repo_url = "https://github.com/nesi/hpc-portal_docs"
repo_name = "nesi/hpc-portal_docs"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright © 2026 REANNZ"
extra_css = ["assets/stylesheets/theme.css"]

[project.theme]
variant = "classic"
custom_dir = "overrides"
language = "en"
logo = "assets/icons/logo_reannz.svg"
favicon = "assets/icons/favicon_reannz.ico"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "header.site_name_homepage",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.plugins.search]

[project.plugins.tags]
tags_allowed = ["account", "portal", "allocation", "project-member", "project-manager", "institution-admin"]

[project.plugins.awesome-nav]

[project.plugins.redirects.redirect_maps]
"project-leads/change-limits.md" = "project-managers/change-limits.md"
"project-leads/extend-request.md" = "project-managers/extend-request.md"
"project-leads/invite-team.md" = "project-managers/invite-team.md"
"project-leads/request-new-project.md" = "project-managers/request-new-project.md"
"project-leads/track-order.md" = "project-managers/track-order.md"

[project.plugins.llmstxt]
markdown_description = "User documentation for the REANNZ HPC Portal: signing in, requesting and extending HPC projects, and approving requests."

[project.plugins.llmstxt.sections]
"Getting started" = ["getting-started/*.md"]
"Project members" = ["members/*.md"]
"Project managers" = ["project-managers/*.md"]
"Institution admins" = ["institution-admins/*.md"]

[project.plugins.privacy]
links_attr_map = { target = "_blank" }

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { baselevel = 1, permalink = true, toc_depth = 3, title = "On this page" }
"pymdownx.details" = {}
"pymdownx.highlight" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.magiclink" = {}
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
